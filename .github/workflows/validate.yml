name: Validate FlowLedger
on:
  push:
    branches: [feat/p0-forecast]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend regression and workspace tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
        env:
          PUBLIC_DEMO: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: Build all static pages
        working-directory: frontend
        run: npm run build
        env:
          STATIC_EXPORT: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: https://flowledger-api-218y.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: flowledger-static-export
          path: frontend/out
          retention-days: 3
